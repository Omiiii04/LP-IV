<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}DFT · Digital Forensics Toolkit{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:root{--ink:#e8eef2;--muted:#91a2ae;--panel:#17232d;--line:#263743;--accent:#35c5c0;--navy:#0d171f}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{color:#8af0e5}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:#101d26;border-right:1px solid var(--line);padding:28px 18px;flex-shrink:0}.brand{font-weight:700;letter-spacing:.08em;color:#fff;font-size:1.1rem;margin:0 10px 38px}.brand small{display:block;color:var(--muted);font-size:.65rem;font-weight:400;letter-spacing:.16em;margin-top:5px}.nav-link{color:var(--muted);border-radius:8px;padding:11px 12px;margin:3px 0}.nav-link:hover,.nav-link.active{color:#fff;background:#1b303a}.nav-link span{display:inline-block;width:25px;color:var(--accent)}.main{flex:1;min-width:0;padding:32px 4vw;max-width:1500px}.eyebrow{font:700 .7rem monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1,h2,h3{color:#f5f8fa}h1{font-size:clamp(1.8rem,3vw,2.7rem);font-weight:700}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.panel,.metric,.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px}.panel{padding:22px}.metric{padding:19px}.metric strong{display:block;font-size:2rem;color:#fff}.metric span{font-size:.78rem;color:var(--muted)}.table{--bs-table-bg:transparent;--bs-table-color:var(--ink);--bs-table-border-color:var(--line);margin:0}.table th{font:700 .68rem monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.table td,.table th{padding:14px 16px;vertical-align:middle}.badge-status{border:1px solid #2e7778;color:#7de0d7;background:#18383d;border-radius:20px;padding:5px 10px;font-size:.72rem}.btn-primary{background:var(--accent);border:0;color:#092126;font-weight:700}.btn-primary:hover{background:#8af0e5;color:#092126}.btn-outline-light{border-color:var(--line);color:var(--ink)}.muted{color:var(--muted)}.hash{font:.75rem monospace;word-break:break-all;color:#b9c9d2}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.form-control,.form-select{background:#101d26;border-color:var(--line);color:var(--ink)}.form-control:focus,.form-select:focus{background:#101d26;color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 .2rem #35c5c033}.activity{border-left:2px solid var(--accent);padding:3px 0 14px 16px;margin-left:6px}.activity small{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}.alert-success{background:#173a35;color:#b9f3dd;border-color:#286a61}.alert-danger{background:#3d2227;color:#ffc6c6;border-color:#8c3c48}@media(max-width:800px){.sidebar{width:72px;padding:22px 10px}.brand{font-size:0;margin:0 0 25px;text-align:center}.brand small{display:none}.nav-link{font-size:0;text-align:center}.nav-link span{font-size:.9rem;width:auto}.main{padding:24px 18px}.page-head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">DFT<small>FORENSIC TOOLKIT</small></div><nav aria-label="Main navigation"><a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}"><span>⌂</span>Dashboard</a><a class="nav-link {% if request.endpoint in ('cases','new_case','create_case','case_detail') %}active{% endif %}" href="{{ url_for('cases') }}"><span>▣</span>Cases</a><a class="nav-link {% if request.endpoint == 'evidence_index' %}active{% endif %}" href="{{ url_for('evidence_index') }}"><span>◇</span>Evidence</a><a class="nav-link {% if request.endpoint == 'logs_index' %}active{% endif %}" href="{{ url_for('logs_index') }}"><span>≡</span>Log Analysis</a><a class="nav-link {% if request.endpoint == 'disk_images_index' %}active{% endif %}" href="{{ url_for('disk_images_index') }}"><span>◈</span>Disk Images</a><a class="nav-link {% if request.endpoint == 'reports_index' %}active{% endif %}" href="{{ url_for('reports_index') }}"><span>↗</span>Reports</a></nav></aside><main class="main">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }} mb-4">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></div></body></html>
